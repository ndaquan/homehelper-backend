name: Build and deploy Node.js app to Azure Web App - homehelper-api-dev

on:
  push:
    branches: [dev]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Prepare deploy folder
        run: |
          mkdir deploy
          shopt -s extglob
          cp -r !(deploy|node_modules|.github) deploy/
          cd deploy
          zip -r ../deploy.zip .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-build
          path: deploy.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-build
          path: .

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_9DA8E62DE71044439E62119C483DDA2D }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_BF75D9D9BEDE4ED0B77A26A5E9FA2395 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_24E09351E8D3489AA558F6AB593E8A88 }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: homehelper-api-dev
          package: deploy.zip
